</style></head><body><main class="app"><header><div><p class="eyebrow">MY TRAINING LOG</p><h1>오늘의 운동</h1></div><div class="week"><b id="week">0</b><span>최근 7일</span></div></header><nav id="tabs"></nav><section class="days" id="days" aria-label="이번 주 운동 기록"></section><section class="hero"><div><small id="kicker"></small><h2 id="title"></h2><p id="desc"></p></div><div class="ring" id="ring"><div><b id="pct">0%</b><span id="count"></span></div></div></section><section id="list"></section><section class="safety"><b>오늘의 기준</b><p>통증이 아니라 ‘힘듦’까지만. 자세가 무너지면 그 세트는 종료하고 중량을 낮춥니다.</p></section><button class="finish" id="finish" disabled></button><section class="stats" id="stats"></section><section class="history"><h2>최근 운동 기록</h2><div id="historyList"></div></section><p class="save">기록은 이 휴대폰에 자동 저장됩니다.</p><div class="timer hidden" id="timer"><div><span>REST</span><strong id="time">1:30</strong></div><button id="skip">건너뛰기</button></div></main>

let S={active:"adapt",checks:{},values:{},history:[],logs:{}};try{S=Object.assign(S,JSON.parse(localStorage.getItem("workout-check")||"{}"))}catch(e){}let timerId,sec=0;const today=()=>new Date().toISOString().slice(0,10),save=()=>localStorage.setItem("workout-check",JSON.stringify(S)),key=(i,j)=>today()+"-"+S.active+"-"+i+"-"+j;
function render(){const s=D[S.active];const rowDone=S.history.filter(r=>r.endsWith("-row")).length;const swingGoal=Math.min(100,30+Math.floor(rowDone/3)*10);tabs.innerHTML=Object.keys(D).map(k=>'<button data-tab="'+k+'" class="'+(k===S.active?"active":"")+'">'+D[k].tab+'</button>').join("");kicker.textContent=s.kick;title.textContent=s.title;desc.textContent=s.desc;let total=0,done=0;list.innerHTML=s.items.map((x,i)=>{total+=x[2];const vk=S.active+"-"+i,v=S.values[vk]??(x[0]==="케틀벨 스윙 챌린지"?swingGoal:x[3]),sets=Array.from({length:x[2]},(_,j)=>{const d=!!S.checks[key(i,j)];if(d)done++;return '<button class="set '+(d?"done":"")+'" data-set="'+i+","+j+'" aria-pressed="'+d+'">'+(d?"✓":j+1)+"</button>"}).join("");return '<article class="card"><div class="head"><div><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div><div class="step"><button data-change="'+i+',-">−</button><span><b>'+v+"</b>"+x[4]+'</span><button data-change="'+i+',+">＋</button></div></div>'+(x[5]?'<p class="tip">TIP · '+x[5]+"</p>":"")+'<div class="sets">'+sets+"</div></article>"}).join("");const p=Math.round(done/total*100);pct.textContent=p+"%";count.textContent=done+"/"+total+" 세트";ring.style.setProperty("--p",p*3.6+"deg");const record=today()+"-"+S.active,stored=S.history.includes(record);finish.disabled=done!==total;finish.className="finish "+(done===total?"ready":"");finish.textContent=stored?"오늘 운동 저장됨 ✓":done===total?"운동 완료 저장":total-done+"세트 남음";week.textContent=S.history.filter(r=>(Date.now()-new Date(r.slice(0,10)).getTime())/86400000<7).length;const now=new Date(),dow=now.getDay(),monday=new Date(now);monday.setDate(now.getDate()-((dow+6)%7));const labels=["월","화","수","목","금","토","일"];days.innerHTML=labels.map((label,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);const ds=d.toISOString().slice(0,10),done=S.history.some(r=>r.startsWith(ds+"-")),today=ds===new Date().toISOString().slice(0,10),plan=i===0||i===2||i===4?"짐":i===1||i===3||i===5?"홈":"휴식";return '<div class="day '+(done?"done ":"")+(today?"today":"")+'"><b>'+label+'</b><span>'+(done?"✓ 완료":plan)+'</span></div>'}).join("");const weekStart=monday.toISOString().slice(0,10),weekLogs=Object.values(S.logs||{}).filter(l=>l.date>=weekStart),rowMinutes=weekLogs.reduce((a,l)=>a+(l.items||[]).filter(x=>x.name.includes("로잉")&&x.unit==="분").reduce((b,x)=>b+Number(x.value||0),0),0),swingReps=weekLogs.reduce((a,l)=>a+(l.items||[]).filter(x=>x.name.includes("스윙")).reduce((b,x)=>b+Number(x.value||0),0),0);stats.innerHTML='<div class="stat"><b>'+weekLogs.length+'</b><span>이번 주 운동</span></div><div class="stat"><b>'+rowMinutes+'분</b><span>로잉 누적</span></div><div class="stat"><b>'+swingReps+'회</b><span>스윙 누적</span></div>';const recent=Object.values(S.logs||{}).sort((a,b)=>b.savedAt-a.savedAt).slice(0,10);historyList.innerHTML=recent.length?recent.map(l=>'<article class="log"><div class="loghead"><b>'+l.date+' · '+l.title+'</b><span>'+l.type+'</span></div><p>'+l.items.map(x=>x.name+' '+x.value+x.unit).join(' · ')+'</p><button class="delete" data-delete="'+l.id+'">기록 삭제</button></article>').join(''):'<p class="empty">아직 저장된 상세 기록이 없습니다.</p>'}
function tick(){time.textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");if(sec<=0)timer.classList.add("hidden")}function rest(){clearInterval(timerId);sec=90;timer.classList.remove("hidden");tick();timerId=setInterval(()=>{sec--;tick();if(sec<=0){clearInterval(timerId);navigator.vibrate&&navigator.vibrate([180,80,180])}},1000)}
document.onclick=e=>{const t=e.target.closest("[data-tab]");if(t){S.active=t.dataset.tab;save();render();return}const set=e.target.closest("[data-set]");if(set){const p=set.dataset.set.split(",").map(Number),k=key(p[0],p[1]),was=!!S.checks[k];S.checks[k]=!was;save();render();if(!was)rest();return}const c=e.target.closest("[data-change]");if(c){const p=c.dataset.change.split(","),i=+p[0],x=D[S.active].items[i],k=S.active+"-"+i,v=S.values[k]??x[3],step=x[4]==="kg"?2.5:1;S.values[k]=Math.max(0,v+(p[1]==="+"?step:-step));save();render()}const del=e.target.closest("[data-delete]");if(del){const id=del.dataset.delete;delete S.logs[id];S.history=S.history.filter(x=>x!==id);save();render()}};skip.onclick=()=>{clearInterval(timerId);sec=0;tick()};finish.onclick=()=>{const r=today()+"-"+S.active,s=D[S.active],rowDone=S.history.filter(x=>x.endsWith("-row")).length,swingGoal=Math.min(100,30+Math.floor(rowDone/3)*10);const items=s.items.map((x,i)=>({name:x[0],value:S.values[S.active+"-"+i]??(x[0]==="케틀벨 스윙 챌린지"?swingGoal:x[3]),unit:x[4],sets:x[2]}));S.logs=S.logs||{};S.logs[r]={id:r,date:today(),type:S.active,title:s.title,items,savedAt:Date.now()};if(!S.history.includes(r))S.history.push(r);save();render()};render();
</script></body></html>
