<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b0a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="운동 체크"><title>나의 운동 체크</title>
<style>
:root{--bg:#080b0a;--card:#111714;--line:#29332d;--text:#f4f7f5;--muted:#98a29b;--lime:#c9ff3d;--orange:#ff9c55}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 85% 0,rgba(201,255,61,.1),transparent 25rem),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button{font:inherit;-webkit-tap-highlight-color:transparent}.app{width:min(100%,560px);min-height:100svh;margin:auto;padding:max(24px,env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.eyebrow{margin:0 0 5px;color:var(--lime);font-size:11px;font-weight:900;letter-spacing:.16em}h1{margin:0;font-size:30px;letter-spacing:-.045em}.week{min-width:76px;padding:9px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:center}.week b{display:block;color:var(--lime);font-size:20px}.week span{display:block;color:var(--muted);font-size:10px}nav{position:sticky;top:8px;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border:1px solid var(--line);border-radius:15px;background:#0d120f}nav button{min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:13px;font-weight:800}nav button.active{background:var(--lime);color:#0b1007}.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;margin:16px 0;padding:20px;border:1px solid #34412d;border-radius:24px;background:linear-gradient(135deg,#182217,#101612 62%)}.hero small{color:var(--lime);font-weight:900}.hero h2{margin:7px 0;font-size:27px}.hero p{margin:0;color:#b8c0ba;font-size:13px;line-height:1.5}.ring{--p:0deg;display:grid;width:82px;height:82px;border-radius:50%;place-items:center;background:conic-gradient(var(--lime) var(--p),#2b342e 0)}.ring:before{content:"";grid-area:1/1;width:68px;height:68px;border-radius:50%;background:#131a15}.ring div{grid-area:1/1;z-index:1;text-align:center}.ring b{display:block;font-size:18px}.ring span{display:block;color:var(--muted);font-size:9px}#list{display:grid;gap:11px}.card{padding:17px;border:1px solid var(--line);border-radius:20px;background:var(--card)}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.head h3{margin:0 0 5px;font-size:17px}.head p{margin:0;color:var(--muted);font-size:12px}.step{display:grid;grid-template-columns:35px minmax(58px,auto) 35px;align-items:center;border:1px solid #344039;border-radius:12px;overflow:hidden}.step button{width:35px;height:40px;border:0;background:#202923;color:var(--text);font-size:20px}.step span{padding:0 5px;color:var(--muted);font-size:11px;text-align:center;white-space:nowrap}.step b{color:var(--text);font-size:14px}.tip{margin:12px 0 0!important;padding:8px 10px;border-radius:9px;background:#1a2115;color:#c5d3b5!important;font-size:11px!important}.sets{display:flex;gap:9px;margin-top:14px}.set{width:48px;height:48px;border:1px solid #3a453e;border-radius:50%;background:#1c241f;color:#c8cfca;font-weight:900}.set.done{border-color:var(--lime);background:var(--lime);color:#101507}.safety{margin:14px 0;padding:16px;border-left:3px solid var(--orange);border-radius:4px 14px 14px 4px;background:#1b1714}.safety b{color:var(--orange);font-size:12px}.safety p{margin:6px 0 0;color:#c8bfba;font-size:12px;line-height:1.55}.finish{width:100%;min-height:56px;border:1px solid #2b342e;border-radius:17px;background:#141a16;color:#68716b;font-weight:900}.finish.ready{border-color:var(--lime);background:var(--lime);color:#101507}.save{color:#626b65;font-size:11px;text-align:center}.timer{position:fixed;z-index:10;right:max(16px,calc((100vw - 528px)/2));bottom:calc(18px + env(safe-area-inset-bottom));left:max(16px,calc((100vw - 528px)/2));display:flex;align-items:center;justify-content:space-between;padding:13px 14px 13px 18px;border:1px solid #405027;border-radius:18px;background:#192015;box-shadow:0 18px 50px #0008}.timer div{display:flex;align-items:baseline;gap:12px}.timer span{color:var(--lime);font-size:10px;font-weight:900;letter-spacing:.14em}.timer strong{font-size:26px}.timer button{min-height:42px;padding:0 15px;border:1px solid #3b463f;border-radius:12px;background:#242d27;color:var(--text);font-size:12px;font-weight:800}.hidden{display:none}@media(max-width:390px){.app{padding-left:12px;padding-right:12px}.hero{padding:17px}.hero p{font-size:12px}.ring{width:74px;height:74px}.ring:before{width:61px;height:61px}.head{align-items:flex-start}.step{grid-template-columns:32px minmax(50px,auto) 32px}.step button{width:32px}}
</style></head><body><main class="app"><header><div><p class="eyebrow">MY TRAINING LOG</p><h1>오늘의 운동</h1></div><div class="week"><b id="week">0</b><span>최근 7일</span></div></header><nav id="tabs"></nav><section class="hero"><div><small id="kicker"></small><h2 id="title"></h2><p id="desc"></p></div><div class="ring" id="ring"><div><b id="pct">0%</b><span id="count"></span></div></div></section><section id="list"></section><section class="safety"><b>오늘의 기준</b><p>통증이 아니라 ‘힘듦’까지만. 자세가 무너지면 그 세트는 종료하고 중량을 낮춥니다.</p></section><button class="finish" id="finish" disabled></button><p class="save">기록은 이 휴대폰에 자동 저장됩니다.</p><div class="timer hidden" id="timer"><div><span>REST</span><strong id="time">1:30</strong></div><button id="skip">건너뛰기</button></div></main>
<script>
const D={
adapt:{tab:"기초",kick:"1–4주 · 주 3회",title:"기초 적응",desc:"숨이 차더라도 자세가 흐트러지지 않는 강도로 시작합니다.",items:[["로잉 워밍업","편안한 속도",1,8,"분","대화가 가능한 속도"],["레그프레스","10회 × 3세트",3,30,"kg","무릎과 발끝 방향 맞추기"],["체스트프레스","10회 × 3세트",3,15,"kg","2–3회 여유 남기기"],["랫풀다운","10회 × 3세트",3,20,"kg","가슴을 살짝 들고 당기기"],["시티드 레그컬","12회 × 2세트",2,15,"kg",""],["가벼운 유산소","정리 운동",1,8,"분",""]]},
a:{tab:"바벨 A",kick:"5주차부터 · A 운동",title:"바벨 A",desc:"모든 본세트가 안정적일 때만 다음 운동에서 중량을 올립니다.",items:[["백 스쿼트","5회 × 3세트",3,20,"kg","랙 안전바 설정 먼저"],["벤치프레스","5회 × 3세트",3,20,"kg","가능하면 스팟터 요청"],["바벨로우","5회 × 3세트",3,20,"kg",""],["랫풀다운","10회 × 2세트",2,20,"kg",""],["가벼운 유산소","마무리",1,8,"분",""]]},
b:{tab:"바벨 B",kick:"5주차부터 · B 운동",title:"바벨 B",desc:"A와 B를 번갈아 주 3회 진행하고, 운동 사이 하루 쉽니다.",items:[["백 스쿼트","5회 × 3세트",3,20,"kg","랙 안전바 설정 먼저"],["오버헤드프레스","5회 × 3세트",3,15,"kg",""],["데드리프트","5회 × 1세트",1,30,"kg","허리보다 바닥을 밀어내기"],["시티드 레그컬","12회 × 2세트",2,15,"kg",""],["가벼운 유산소","마무리",1,8,"분",""]]},
row:{tab:"홈 로잉",kick:"집 · 회복일",title:"홈 로잉",desc:"근력운동 다음 날, 회복을 방해하지 않는 편안한 강도로 탑니다.",items:[["로잉 준비","아주 가볍게",1,5,"분",""],["지속 로잉","호흡 일정하게",1,15,"분","말할 수 있는 강도"],["쿨다운","천천히",1,5,"분",""]]}};
let S={active:"adapt",checks:{},values:{},history:[]};try{S=Object.assign(S,JSON.parse(localStorage.getItem("workout-check")||"{}"))}catch(e){}let timerId,sec=0;const today=()=>new Date().toISOString().slice(0,10),save=()=>localStorage.setItem("workout-check",JSON.stringify(S)),key=(i,j)=>today()+"-"+S.active+"-"+i+"-"+j;
function render(){const s=D[S.active];tabs.innerHTML=Object.keys(D).map(k=>'<button data-tab="'+k+'" class="'+(k===S.active?"active":"")+'">'+D[k].tab+'</button>').join("");kicker.textContent=s.kick;title.textContent=s.title;desc.textContent=s.desc;let total=0,done=0;list.innerHTML=s.items.map((x,i)=>{total+=x[2];const vk=S.active+"-"+i,v=S.values[vk]??x[3],sets=Array.from({length:x[2]},(_,j)=>{const d=!!S.checks[key(i,j)];if(d)done++;return '<button class="set '+(d?"done":"")+'" data-set="'+i+","+j+'" aria-pressed="'+d+'">'+(d?"✓":j+1)+"</button>"}).join("");return '<article class="card"><div class="head"><div><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div><div class="step"><button data-change="'+i+',-">−</button><span><b>'+v+"</b>"+x[4]+'</span><button data-change="'+i+',+">＋</button></div></div>'+(x[5]?'<p class="tip">TIP · '+x[5]+"</p>":"")+'<div class="sets">'+sets+"</div></article>"}).join("");const p=Math.round(done/total*100);pct.textContent=p+"%";count.textContent=done+"/"+total+" 세트";ring.style.setProperty("--p",p*3.6+"deg");const record=today()+"-"+S.active,stored=S.history.includes(record);finish.disabled=done!==total;finish.className="finish "+(done===total?"ready":"");finish.textContent=stored?"오늘 운동 저장됨 ✓":done===total?"운동 완료 저장":total-done+"세트 남음";week.textContent=S.history.filter(r=>(Date.now()-new Date(r.slice(0,10)).getTime())/86400000<7).length}
function tick(){time.textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");if(sec<=0)timer.classList.add("hidden")}function rest(){clearInterval(timerId);sec=90;timer.classList.remove("hidden");tick();timerId=setInterval(()=>{sec--;tick();if(sec<=0){clearInterval(timerId);navigator.vibrate&&navigator.vibrate([180,80,180])}},1000)}
document.onclick=e=>{const t=e.target.closest("[data-tab]");if(t){S.active=t.dataset.tab;save();render();return}const set=e.target.closest("[data-set]");if(set){const p=set.dataset.set.split(",").map(Number),k=key(p[0],p[1]),was=!!S.checks[k];S.checks[k]=!was;save();render();if(!was)rest();return}const c=e.target.closest("[data-change]");if(c){const p=c.dataset.change.split(","),i=+p[0],x=D[S.active].items[i],k=S.active+"-"+i,v=S.values[k]??x[3],step=x[4]==="kg"?2.5:1;S.values[k]=Math.max(0,v+(p[1]==="+"?step:-step));save();render()}};skip.onclick=()=>{clearInterval(timerId);sec=0;tick()};finish.onclick=()=>{const r=today()+"-"+S.active;if(!S.history.includes(r))S.history.push(r);save();render()};render();
</script></body></html>
